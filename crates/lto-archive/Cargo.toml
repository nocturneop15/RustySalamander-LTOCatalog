[package]
name = "lto-archive"
description = "Jobs on a tape library with an offline catalog: inventory, import, read, write, format; what the plugin and ltocat share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
lto-scsi.workspace = true
ltfs.workspace = true
lto-catalog.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
lto-sim.workspace = true
