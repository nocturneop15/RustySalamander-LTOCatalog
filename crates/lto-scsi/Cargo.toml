[package]
name = "lto-scsi"
description = "SCSI commands for LTO tape drives and medium changers (tape libraries), over Windows' SCSI pass-through"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
