[package]
name = "lto-catalog"
description = "The offline catalog of LTFS tapes: what each tape holds and where it is, in SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[target."cfg(windows)".dependencies]
# whether the catalog is on a network share (GetDriveTypeW)
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dependencies]
ltfs.workspace = true
# TapeAlert flags, said in words
lto-scsi.workspace = true
# the plugin's settings format, shared with ltocat (place.rs)
sal-plugin-api.workspace = true
# SQLite built in (with the MinGW gcc), no DLL to ship
rusqlite = { version = "0.40", features = ["bundled"] }
