[language]
code = "cs"
name = "Čeština"
plural = "cs"

[strings]
"\"{barcode}\" isn't a barcode: a barcode has letters A–Z and digits only, at most 16, such as LTO001L5." = "\"{barcode}\" není čárový kód: čárový kód má jen písmena A–Z a číslice, nejvýš 16, například LTO001L5."
"\"{folder}\" isn't a folder." = "„{folder}“ není složka."
"A device name can't contain line breaks or other control characters." = "Název zařízení nesmí obsahovat zalomení řádku ani jiné řídicí znaky."
"A library moves the tape to its mail slot; a standalone drive ejects it." = "Knihovna přesune pásku do své poštovní přihrádky, samostatná mechanika ji vysune."
"A mask: * any characters, ? one. Only on tape: a barcode, or empty for every tape. The catalog is searched; no tape is loaded. Found files are copied out of the results like out of the tapes." = "Maska: * libovolné znaky, ? jeden znak. Jen na pásce: čárový kód, prázdné pro všechny pásky. Prohledá se katalog; žádná páska se nezakládá. Nalezené soubory se z výsledků kopírují jako z pásek."
"A name on the tape can't be used on disk: {name}" = "Název na pásce nelze použít na disku: {name}"
"A name to look for has at most 256 characters, without line breaks." = "Hledaný název má nejvýš 256 znaků, bez zalomení řádku."
"a tape that can't be identified" = "páska, kterou nelze rozpoznat"
"A volume name can have at most 256 characters, without line breaks or other control characters." = "Název svazku může mít nejvýš 256 znaků, bez zalomení řádku a jiných řídicích znaků."
"Another tape (barcode)" = "Jiná páska (čárový kód)"
"Another tape: one that isn't listed, such as a new one in a standalone drive. Volume name: empty names each tape by its barcode." = "Jiná páska: taková, která v seznamu není, např. nová v samostatné mechanice. Název svazku: prázdný pojmenuje každou pásku jejím čárovým kódem."
"Barcode" = "Čárový kód"
"Barcodes" = "Čárové kódy"
"Cancel" = "Zrušit"
"Cancelled." = "Zrušeno."
"Cancelled: {n} tapes weren't formatted." = "Zrušeno: {n} pásek se nenaformátovalo."
"Cancelled: {n} tapes weren't imported." = "Zrušeno: {n} pásek se nenačetlo."
"cancelling…" = "ruší se…"
"Catalog file" = "Soubor katalogu"
"Catalog: {tapes} tapes, {files} files" = "Katalog: pásky {tapes}, soubory {files}"
"Changers (\\\\.\\Changer0 or scsi:port:bus:target:lun, comma-separated)" = "Měniče (\\\\.\\Changer0 nebo scsi:port:sběrnice:cíl:lun, oddělené čárkou)"
"Drive {drive} holds a tape that can't be identified: no barcode in its memory, and its volume isn't in the catalog." = "V mechanice {drive} je páska, kterou nelze rozpoznat: v její paměti není čárový kód a její svazek není v katalogu."
"Drive {drive} holds tape {tape}." = "V mechanice {drive} je páska {tape}."
"Drive {drive} was to hold tape {wanted}, but the cartridge in it says it is {found}. Nothing was done to it. The library's drives may be matched to the wrong tape devices, or tapes were moved at the library's panel: run Inventory and try again; if it happens again, send the output of \"ltocat selftest\"." = "Mechanika {drive} měla obsahovat pásku {wanted}, ale kazeta v ní o sobě říká, že je {found}. Nic se s ní neprovedlo. Mechaniky knihovny mohou být přiřazeny ke špatným páskovým zařízením, nebo byly pásky přesunuty na panelu knihovny: spusťte Inventuru a zkuste to znovu; pokud se to stane znovu, pošlete výstup \"ltocat selftest\"."
"Drive {n}: {device}, serial {serial}: {tape}" = "Mechanika {n}: {device}, sériové číslo {serial}: {tape}"
"Each tape is loaded and its index read into the catalog. This takes a minute or two per tape." = "Každá páska se zavede a její index se načte do katalogu. U každé pásky to trvá minutu nebo dvě."
"Eject" = "Vysunout"
"Eject a tape" = "Vysunout pásku"
"Eject a tape…" = "Vysunout pásku…"
"Eject tape…" = "Vysunout pásku…"
"ejecting the tape…" = "vysouvá se páska…"
"empty" = "prázdná"
"Every tape in the library" = "Všechny pásky v knihovně"
"Files can be copied only into a tape, not next to the tapes. Open a tape first." = "Soubory lze kopírovat jen na pásku, ne vedle pásek. Nejprve otevřete pásku."
"Forget" = "Zapomenout"
"Forget a tape" = "Zapomenout pásku"
"Forget a tape…" = "Zapomenout pásku…"
"Forget tape…" = "Zapomenout pásku…"
"Format" = "Formátovat"
"Format tapes" = "Formátovat pásky"
"Format tapes…" = "Formátovat pásky…"
"Format tape…" = "Formátovat pásku…"
"Formatting erases everything on the tapes and makes each an empty LTFS volume." = "Formátování smaže vše na páskách a z každé udělá prázdný svazek LTFS."
"formatting…" = "formátuje se…"
"Import" = "Načíst"
"Import tapes" = "Načíst pásky"
"Import tapes…" = "Načíst pásky…"
"Import tape…" = "Importovat pásku…"
"importing tapes…" = "načítají se pásky…"
"in no library or drive" = "v žádné knihovně ani mechanice"
"Insert tape" = "Vložte pásku"
"Inventory the libraries and drives" = "Inventura knihoven a mechanik"
"Items can't be moved from one tape to another by renaming; copy them instead." = "Položky nelze přejmenováním přesunout z jedné pásky na jinou; zkopírujte je."
"Leave the devices empty to find every library and drive. Drives no library claims are standalone: tapes are put into them by hand. The program needs to run as administrator to reach the devices." = "Nechte zařízení prázdná a najdou se všechny knihovny a mechaniky. Mechaniky, které nepatří žádné knihovně, jsou samostatné: pásky se do nich vkládají ručně. Program musí běžet jako správce, aby se k zařízením dostal."
"libraries: {libraries}, drives: {drives}" = "knihovny: {libraries}, mechaniky: {drives}"
"Library settings" = "Nastavení knihovny"
"Library settings…" = "Nastavení knihovny…"
"Library status" = "Stav knihovny"
"Library: {vendor} {product} ({device})" = "Knihovna: {vendor} {product} ({device})"
"Look for" = "Hledat"
"looking for tape libraries and drives…" = "hledají se páskové knihovny a mechaniky…"
"LTFS tapes in an LTO tape library, browsed from an offline catalog; the library loads a tape when files are copied from or to it. Start with Plugins → Open tape catalog." = "Pásky LTFS v páskové knihovně LTO, procházené z offline katalogu; knihovna pásku zavede, když se z ní nebo na ni kopírují soubory. Začněte v Pluginy → Otevřít katalog pásek."
"LTFS, {files} files, {size}" = "LTFS, souborů: {files}, {size}"
"LTO tape catalog" = "Katalog pásek LTO"
"Name" = "Název"
"names containing it" = "názvy, které ho obsahují"
"names matching a mask (*.mkv)" = "názvy odpovídající masce (*.mkv)"
"no LTFS volume" = "bez svazku LTFS"
"No tape is in a library or drive now." = "V žádné knihovně ani mechanice teď není páska."
"No tape library or drive can be used: {reason}" = "Nelze použít žádnou páskovou knihovnu ani mechaniku: {reason}"
"No tape library was found: tapes are put into the drives by hand." = "Nebyla nalezena žádná pásková knihovna: pásky se do mechanik vkládají ručně."
"Not enough space on the tape: {need} bytes needed, {free} bytes free." = "Na pásce není dost místa: potřeba {need} bajtů, volných {free} bajtů."
"not imported" = "nenačtena"
"Not in the catalog yet: {tapes}. Use Import tapes… to read them." = "Ještě nejsou v katalogu: {tapes}. Načtěte je příkazem Načíst pásky…."
"Not on the tape: {items}" = "Na pásce není: {items}"
"Note (where the tape is kept)" = "Poznámka (kde je páska uložena)"
"Note about a tape" = "Poznámka k pásce"
"Note about a tape…" = "Poznámka k pásce…"
"Note about tape…" = "Poznámka k pásce…"
"Note: {note}" = "Poznámka: {note}"
"Nothing in the catalog is named like \"{text}\"." = "V katalogu se nic nejmenuje jako \"{text}\"."
"Nothing was done: no tape was ticked or typed." = "Nic se neprovedlo: žádná páska nebyla zaškrtnuta ani zadána."
"Nothing was done: the barcode typed again doesn't match." = "Nic se nestalo: znovu zadaný čárový kód nesouhlasí."
"Nothing was done: type {word} to confirm." = "Nic se neprovedlo: pro potvrzení napište {word}."
"Only on tape" = "Jen na pásce"
"Open tape catalog" = "Otevřít katalog pásek"
"opening the catalog and the devices…" = "otevírá se katalog a zařízení…"
"Put the tapes in the drives back" = "Vrátit pásky z mechanik"
"putting the tapes back…" = "pásky se vracejí na místo…"
"reading the libraries' inventories…" = "čte se inventář knihoven…"
"Retry" = "Zkusit znovu"
"Save" = "Uložit"
"Saved. The library is opened again when it is needed." = "Uloženo. Knihovna se znovu otevře, až bude potřeba."
"Search" = "Hledat"
"Search the catalog" = "Hledat v katalogu"
"Search the catalog…" = "Hledat v katalogu…"
"searching the catalog…" = "prohledává se katalog…"
"Skip this tape" = "Přeskočit tuto pásku"
"Standalone drive {device}, serial {serial}: {tape}" = "Samostatná mechanika {device}, sériové číslo {serial}: {tape}"
"Tape catalog: \"{text}\" (the first {n} found)" = "Katalog pásek: \"{text}\" (prvních {n} nalezených)"
"Tape catalog: \"{text}\" ({n} found)" = "Katalog pásek: \"{text}\" (nalezeno: {n})"
"Tape drives, in libraries and standalone (\\\\.\\Tape0, \\\\.\\Tape1)" = "Páskové mechaniky, v knihovnách i samostatné (\\\\.\\Tape0, \\\\.\\Tape1)"
"Tape {barcode} came out of drive {drive}." = "Páska {barcode} byla vysunuta z mechaniky {drive}."
"Tape {barcode} is in no library or drive. Put it into the mail slot of {libraries}, or insert it into drive {drives}, then press Retry." = "Páska {barcode} není v žádné knihovně ani mechanice. Vložte ji do poštovní přihrádky knihovny {libraries} nebo do mechaniky {drives} a stiskněte Zkusit znovu."
"Tape {barcode} is in no library or tape drive." = "Páska {barcode} není v žádné knihovně ani páskové mechanice."
"Tape {barcode} is in none of the drives. Insert it into one of them ({drives}), then press Retry." = "Páska {barcode} není v žádné z mechanik. Vložte ji do jedné z nich ({drives}) a stiskněte Zkusit znovu."
"Tape {barcode} is in none of the libraries. Put it into the mail slot of one of them ({libraries}), then press Retry." = "Páska {barcode} není v žádné z knihoven. Vložte ji do poštovní přihrádky jedné z nich ({libraries}) a stiskněte Zkusit znovu."
"Tape {barcode} is in the mail slot." = "Páska {barcode} je ve vkládací šachtě."
"Tape {barcode} is no longer in the catalog. The tape itself is unchanged." = "Páska {barcode} už není v katalogu. Na samotné pásce se nic nezměnilo."
"Tape {barcode} is not in the catalog yet. Import it first: Plugins → Import tapes…." = "Páska {barcode} ještě není v katalogu. Nejprve ji načtěte: Pluginy → Načíst pásky…."
"Tape {barcode} is not in the drive. Insert it into drive {drive}, then press Retry." = "Páska {barcode} není v mechanice. Vložte ji do mechaniky {drive} a stiskněte Zkusit znovu."
"Tape {barcode} is not in the library. Put it into the mail slot (or a magazine), then press Retry." = "Páska {barcode} není v knihovně. Vložte ji do vkládací šachty (nebo do zásobníku) a stiskněte Zkusit znovu."
"Tape {barcode} is now an empty LTFS volume ({uuid})." = "Páska {barcode} je nyní prázdný svazek LTFS ({uuid})."
"Tape {barcode} isn't formatted for LTFS. Format it first: Plugins → Format a tape…." = "Páska {barcode} není naformátovaná pro LTFS. Nejprve ji naformátujte: Pluginy → Formátovat pásku…."
"tape {n} of {total}: {barcode}" = "páska {n} z {total}: {barcode}"
"Tape {tape} was ejected from drive {drive} to make room." = "Páska {tape} byla vysunuta z mechaniky {drive}, aby se uvolnilo místo."
"Tapes" = "Pásky"
"Tapes can't be deleted here. To take a tape out of the catalog, use Plugins → Forget a tape…." = "Pásky zde nelze mazat. Pásku odeberete z katalogu příkazem Pluginy → Zapomenout pásku…."
"Tapes can't be made as folders. Put a tape into the library and use Plugins → Format a tape…." = "Pásky nelze vytvářet jako složky. Vložte pásku do knihovny a použijte Pluginy → Formátovat pásku…."
"Tapes can't be renamed: a tape's name is its barcode." = "Pásky nelze přejmenovat: název pásky je její čárový kód."
"Tapes in the libraries and drives: {n}." = "Pásky v knihovnách a mechanikách: {n}."
"Tapes in the library that aren't in the catalog yet" = "Pásky v knihovně, které ještě nejsou v katalogu"
"tapes: {text}" = "pásky: {text}"
"The catalog file can't be used: {reason}" = "Soubor katalogu nelze použít: {reason}"
"The catalog of tape {barcode} was out of date and has been updated from the tape. Nothing was changed; check the files and try again." = "Katalog pásky {barcode} byl zastaralý a byl aktualizován z pásky. Nic se nezměnilo; zkontrolujte soubory a zkuste to znovu."
"The catalog {file} can't be opened: {error}" = "Katalog {file} nelze otevřít: {error}"
"The tape can't be written: {reason}" = "Na pásku nelze zapisovat: {reason}"
"The tape in drive {drive} was ejected to make room." = "Páska z mechaniky {drive} byla vysunuta, aby se uvolnilo místo."
"The tape is full. The files copied before it filled up are on it." = "Páska je plná. Soubory zkopírované před jejím zaplněním na ní jsou."
"The tape is taken out of the catalog; nothing on it changes." = "Páska se odebere z katalogu; na ní samotné se nic nezmění."
"There are no tapes to import." = "Nejsou žádné pásky k načtení."
"These tapes were skipped, their files weren't copied: {tapes}" = "Tyto pásky byly přeskočeny, jejich soubory se nezkopírovaly: {tapes}"
"These tapes:" = "Tyto pásky:"
"This isn't the tape catalog." = "Toto není katalog pásek."
"Type a name, or a part of one, to look for." = "Napište název nebo jeho část, který se má hledat."
"Type the barcode again" = "Zadejte čárový kód znovu"
"Type {word} to confirm" = "Pro potvrzení napište {word}"
"Volume name" = "Název svazku"
"Volume: {name}" = "Svazek: {name}"
"{barcode} is in {drive}: reading its LTFS volume…" = "{barcode} je v {drive}: čte se svazek LTFS…"
"{barcode}: an empty LTFS volume" = "{barcode}: prázdný svazek LTFS"
"{barcode}: formatting (a few minutes; it can't be stopped halfway)…" = "{barcode}: formátuje se (několik minut; nelze přerušit v polovině)…"
"{barcode}: getting it into a drive…" = "{barcode}: zakládá se do mechaniky…"
"{barcode}: waiting for the library to read its mail slot…" = "{barcode}: čeká se, až knihovna načte vkládací šachtu…"
"{barcode}: no LTFS volume" = "{barcode}: bez svazku LTFS"
"{barcode}: reading {path}" = "{barcode}: čte se {path}"
"{barcode}: writing its index…" = "{barcode}: zapisuje se rejstřík…"
"{barcode}: writing {path}" = "{barcode}: zapisuje se {path}"
"{barcode}: {files} files, {size}" = "{barcode}: soubory {files}, {size}"
"{files} files, {size}, {free} free" = "soubory {files}, {size}, volno {free}"
