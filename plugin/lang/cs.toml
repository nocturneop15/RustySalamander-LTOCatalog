"The tapes are full; {size} is still to back up. Insert a new tape into a drive, then press Continue." = "Pásky jsou plné; zbývá zazálohovat {size}. Vložte novou pásku do mechaniky a stiskněte Pokračovat."
"The tapes are full; {size} is still to back up. Put a new tape into the mail slot ({libraries}), then press Continue." = "Pásky jsou plné; zbývá zazálohovat {size}. Vložte novou pásku do vkládací šachty ({libraries}) a stiskněte Pokračovat."
"Use another tape" = "Použít jinou pásku"
"backing up…" = "zálohuje se…"
"everything" = "vše"
"only files with the Archive attribute" = "jen soubory s atributem Archiv"
"waiting for a new tape in the mail slot…" = "čeká se na novou pásku ve vkládací šachtě…"
"{barcode}: backing up, {n} of {total} files, {done} of {all}…" = "{barcode}: zálohuje se, {n} z {total} souborů, {done} z {all}…"
"{files} files ({size}) backed up into \"{set}\"." = "Do „{set}“ se zazálohovalo {files} souborů ({size})."
"… and {n} more" = "… a dalších {n}"
"an error that couldn't be recovered while reading, writing or positioning" = "neopravitelná chyba při čtení, zápisu nebo převíjení"
"At the end of each tape the index is always written into both partitions. After a failure, the newest index is at the end of the data; this plugin and IBM LTFS find it there." = "Na konci každé pásky se index vždy zapíše do obou oddílů. Po selhání je nejnovější index na konci dat; tento plugin i IBM LTFS ho tam najdou."
"at the end of the data only (a few seconds; as IBM LTFS does)" = "jen na konec dat (pár sekund; jako IBM LTFS)"
"Check tapes" = "Kontrola pásek"
"Check tapes…" = "Zkontrolovat pásky…"
"Check tape…" = "Zkontrolovat pásku…"
"Check" = "Zkontrolovat"
"checking tapes…" = "kontrolují se pásky…"
"Copy its files onto another tape and stop using it. Plugins → Check tapes… finds the files that can't be read." = "Zkopírujte její soubory na jinou pásku a přestaňte ji používat. Soubory, které nelze přečíst, najde Moduly → Zkontrolovat pásky…."
"Damaged tape" = "Poškozená páska"
"Damaged: {what}" = "Poškozená: {what}"
"During a backup, every 100 GB, write the index" = "Během zálohy každých 100 GB zapisovat index"
"Every file of the ticked tapes is read, to find what can't be. Nothing is written, and the data read is thrown away; a full tape takes hours. A tape read without a fault is no longer noted as damaged." = "Přečte se každý soubor zaškrtnutých pásek, aby se našlo, co přečíst nelze. Nic se nezapisuje a přečtená data se zahazují; plná páska trvá hodiny. Páska přečtená bez chyby už není vedena jako poškozená."
"Go on with another tape" = "Pokračovat na jiné pásce"
"into the index partition too (the tape moves there and back, a minute or two)" = "i do indexového oddílu (páska tam a zpět převíjí, minutu či dvě)"
"its index in partition {partition} can't be read" = "index v oddílu {partition} nelze přečíst"
"No LTFS tape is in a library or drive now." = "Žádná páska LTFS teď není v knihovně ani v mechanice."
"Not readable: the index in partition {partition} ({error})." = "Nelze přečíst: index v oddílu {partition} ({error})."
"Not readable: the label in partition {partition} ({error})." = "Nelze přečíst: štítek v oddílu {partition} ({error})."
"Part of tape {barcode} can't be read. Its index was read from the other copy, in partition {partition} (generation {generation}, written {time}). The tape is used read-only: nothing is written onto it." = "Část pásky {barcode} nelze přečíst. Její index se načetl z druhé kopie, v oddílu {partition} (generace {generation}, zapsaná {time}). Páska se používá jen pro čtení: nic se na ni nezapisuje."
"read failure: the tape is damaged, or the drive is faulty" = "selhalo čtení: páska je poškozená, nebo je vadná mechanika"
"reading it failed" = "čtení selhalo"
"Tape drives" = "Páskové mechaniky"
"Tape {barcode} failed: {error}" = "Páska {barcode} selhala: {error}"
"TapeAlert {n}" = "TapeAlert {n}"
"TapeAlert {n}: {text}" = "TapeAlert {n}: {text}"
"Tapes that failed, noted as damaged in the catalog ({n}):" = "Pásky, které selhaly, v katalogu vedené jako poškozené ({n}):"
"The backup didn't start: {error}" = "Záloha nezačala: {error}"
"The backup stopped: {error}\n{files} of {total} files ({size}) were backed up into \"{set}\" before; they are on the tapes." = "Záloha se zastavila: {error}\nPředtím se do „{set}“ zazálohovalo {files} z {total} souborů ({size}); jsou na páskách."
"the cartridge memory chip has failed" = "selhal paměťový čip kazety"
"The catalog lists generation {catalog} of the tape: files written after generation {generation} are listed, but can't be read from it." = "Katalog vede generaci {catalog} pásky: soubory zapsané po generaci {generation} jsou v seznamu, ale z pásky je přečíst nelze."
"the cleaning cartridge is used up" = "čisticí kazeta je opotřebovaná"
"the cleaning cartridge isn't a valid one" = "čisticí kazeta není platná"
"the drive has a hardware fault: run its diagnostics" = "mechanika má hardwarovou závadu: spusťte její diagnostiku"
"the drive has a hardware fault: switch it off and on again" = "mechanika má hardwarovou závadu: vypněte ji a znovu zapněte"
"the drive has severe trouble reading this tape" = "mechanika má s čtením této pásky vážné potíže"
"the drive has severe trouble writing this tape" = "mechanika má se zápisem na tuto pásku vážné potíže"
"the drive is due for its routine cleaning" = "mechanika potřebuje pravidelné čištění"
"the drive needs cleaning now" = "mechaniku je třeba hned vyčistit"
"the drive predicts that it will fail" = "mechanika předpovídá svou poruchu"
"the tape couldn't be loaded or unloaded" = "pásku nešlo založit nebo vysunout"
"The tape drives reported:" = "Páskové mechaniky hlásí:"
"the tape has reached the end of its life: copy the data onto another tape" = "páska dosáhla konce životnosti: zkopírujte data na jinou pásku"
"the tape is damaged, or the drive is faulty: copy the data off it" = "páska je poškozená, nebo je vadná mechanika: zkopírujte z ní data"
"the tape is nearing the end of its life" = "páska se blíží konci životnosti"
"the tape isn't data grade" = "páska není určená pro data"
"The tape loaded as {barcode} holds another LTFS volume than the catalog has for it. Nothing was written and the catalog wasn't changed. Run Inventory the libraries and drives; if the tape was formatted by another program, import it." = "Páska zavedená jako {barcode} obsahuje jiný svazek LTFS, než má katalog. Nic se nezapsalo a katalog se nezměnil. Spusťte inventuru knihoven a mechanik; pokud pásku naformátoval jiný program, importujte ji."
"The tape loaded as {barcode} holds tape {other}'s LTFS volume. Nothing was written and the catalog wasn't changed. Run Inventory the libraries and drives, and check which tape is where." = "Páska zavedená jako {barcode} obsahuje svazek LTFS pásky {other}. Nic se nezapsalo a katalog se nezměnil. Spusťte inventuru knihoven a mechanik a zkontrolujte, která páska je kde."
"the tape's directory is damaged: reading may be slow" = "adresář pásky je poškozený: čtení může být pomalé"
"the tape's system area is damaged" = "systémová oblast pásky je poškozená"
"Write a detailed log ({file})" = "Zapisovat podrobný protokol ({file})"
"write failure: the tape is damaged, or the drive is faulty" = "selhal zápis: páska je poškozená, nebo je vadná mechanika"
"writing it failed" = "zápis selhal"
"{barcode}: all {n} files read ({size}); nothing is wrong." = "{barcode}: přečteno všech {n} souborů ({size}); vše v pořádku."
"{barcode}: backing up, {n} of {total} files, {done} of {all}, average {speed}/s…" = "{barcode}: zálohuje se, {n} z {total} souborů, {done} z {all}, průměrně {speed}/s…"
"{barcode}: checking, {n} of {total} files, {done} of {all}…" = "{barcode}: kontroluje se, {n} z {total} souborů, {done} z {all}…"
"{barcode}: checking, {n} of {total} files, {done} of {all}, average {speed}/s…" = "{barcode}: kontroluje se, {n} z {total} souborů, {done} z {all}, průměrně {speed}/s…"
"{barcode}: one copy of its index can't be read; it is used read-only." = "{barcode}: jednu kopii jejího indexu nelze přečíst; používá se jen pro čtení."
"{barcode}: skipped, it wasn't put in." = "{barcode}: přeskočena, nebyla vložena."
"{barcode}: the check stopped after {n} of {total} files: {error}" = "{barcode}: kontrola se zastavila po {n} z {total} souborů: {error}"
"{barcode}: {bad} of {total} files can't be read; the others were read. Copy what can be read onto another tape." = "{barcode}: {bad} z {total} souborů nelze přečíst; ostatní se přečetly. Zkopírujte, co jde přečíst, na jinou pásku."
"{drive} (tape {barcode}): {alert}" = "{drive} (páska {barcode}): {alert}"
"{n} files can't be read" = "souborů, které nelze přečíst: {n}"
"{size} is still to back up. What its last index holds is safe on the tape; the rest is written onto the next tape. The tape is noted as damaged in the catalog." = "Zbývá zazálohovat {size}. Co obsahuje její poslední index, je na pásce v bezpečí; zbytek se zapíše na další pásku. Páska je v katalogu vedena jako poškozená."
