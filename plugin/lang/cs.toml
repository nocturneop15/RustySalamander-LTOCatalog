[language]
code = "cs"
name = "Čeština"
plural = "cs"

[strings]
"A name on the tape can't be used on disk: {name}" = "Název na pásce nelze použít na disku: {name}"
"Barcode" = "Čárový kód"
"Barcodes" = "Čárové kódy"
"Cancel" = "Zrušit"
"Cancelled." = "Zrušeno."
"Catalog file" = "Soubor katalogu"
"Catalog: {tapes} tapes, {files} files" = "Katalog: pásky {tapes}, soubory {files}"
"Changer (\\\\.\\Changer0 or scsi:port:bus:target:lun)" = "Měnič (\\\\.\\Changer0 nebo scsi:port:sběrnice:cíl:lun)"
"Drive {n}: {device}, serial {serial}: {tape}" = "Mechanika {n}: {device}, sériové číslo {serial}: {tape}"
"Each tape is loaded and its index read into the catalog. This takes a minute or two per tape." = "Každá páska se zavede a její index se načte do katalogu. U každé pásky to trvá minutu nebo dvě."
"Every tape in the library" = "Všechny pásky v knihovně"
"Files can be copied only into a tape, not next to the tapes. Open a tape first." = "Soubory lze kopírovat jen na pásku, ne vedle pásek. Nejprve otevřete pásku."
"Forget a tape" = "Zapomenout pásku"
"Forget a tape…" = "Zapomenout pásku…"
"Forget" = "Zapomenout"
"Format a tape" = "Formátovat pásku"
"Format a tape…" = "Formátovat pásku…"
"Format" = "Formátovat"
"Formatting erases everything on the tape and makes it an empty LTFS volume." = "Formátování smaže vše na pásce a vytvoří z ní prázdný svazek LTFS."
"Import tapes" = "Načíst pásky"
"Import tapes…" = "Načíst pásky…"
"Import" = "Načíst"
"Insert tape" = "Vložte pásku"
"Inventory the library" = "Inventura knihovny"
"Items can't be moved from one tape to another by renaming; copy them instead." = "Položky nelze přejmenováním přesunout z jedné pásky na jinou; zkopírujte je."
"LTFS tapes in an LTO tape library, browsed from an offline catalog; the library loads a tape when files are copied from or to it. Start with Plugins → Open tape catalog." = "Pásky LTFS v páskové knihovně LTO, procházené z offline katalogu; knihovna pásku zavede, když se z ní nebo na ni kopírují soubory. Začněte v Pluginy → Otevřít katalog pásek."
"LTO tape catalog" = "Katalog pásek LTO"
"Leave the devices empty to find them. The program needs to run as administrator to reach the library." = "Ponechte zařízení prázdná, budou vyhledána. Aby program knihovnu ovládal, musí běžet jako správce."
"Library settings" = "Nastavení knihovny"
"Library settings…" = "Nastavení knihovny…"
"Library status" = "Stav knihovny"
"Library: {vendor} {product} ({device})" = "Knihovna: {vendor} {product} ({device})"
"Move a tape to the mail slot" = "Přesunout pásku do vkládací šachty"
"Move a tape to the mail slot…" = "Přesunout pásku do vkládací šachty…"
"Move" = "Přesunout"
"Not enough space on the tape: {need} bytes needed, {free} bytes free." = "Na pásce není dost místa: potřeba {need} bajtů, volných {free} bajtů."
"Not in the catalog yet: {tapes}. Use Import tapes… to read them." = "Ještě nejsou v katalogu: {tapes}. Načtěte je příkazem Načíst pásky…."
"Not on the tape: {items}" = "Na pásce není: {items}"
"Note (where the tape is kept)" = "Poznámka (kde je páska uložena)"
"Note about a tape" = "Poznámka k pásce"
"Note about a tape…" = "Poznámka k pásce…"
"Note: {note}" = "Poznámka: {note}"
"Nothing was done: the barcode typed again doesn't match." = "Nic se nestalo: znovu zadaný čárový kód nesouhlasí."
"Open tape catalog" = "Otevřít katalog pásek"
"Put the tapes in the drives back" = "Vrátit pásky z mechanik"
"Retry" = "Zkusit znovu"
"Save" = "Uložit"
"Saved. The library is opened again when it is needed." = "Uloženo. Knihovna se znovu otevře, až bude potřeba."
"Skip this tape" = "Přeskočit tuto pásku"
"Tape drives (\\\\.\\Tape0, \\\\.\\Tape1)" = "Páskové mechaniky (\\\\.\\Tape0, \\\\.\\Tape1)"
"Tape {barcode} is in the mail slot." = "Páska {barcode} je ve vkládací šachtě."
"Tape {barcode} is no longer in the catalog. The tape itself is unchanged." = "Páska {barcode} už není v katalogu. Na samotné pásce se nic nezměnilo."
"Tape {barcode} is not in the catalog yet. Import it first: Plugins → Import tapes…." = "Páska {barcode} ještě není v katalogu. Nejprve ji načtěte: Pluginy → Načíst pásky…."
"Tape {barcode} is not in the library. Put it into the mail slot (or a magazine), then press Retry." = "Páska {barcode} není v knihovně. Vložte ji do vkládací šachty (nebo do zásobníku) a stiskněte Zkusit znovu."
"Tape {barcode} is not in the library." = "Páska {barcode} není v knihovně."
"Tape {barcode} is now an empty LTFS volume ({uuid})." = "Páska {barcode} je nyní prázdný svazek LTFS ({uuid})."
"Tape {barcode} isn't formatted for LTFS. Format it first: Plugins → Format a tape…." = "Páska {barcode} není naformátovaná pro LTFS. Nejprve ji naformátujte: Pluginy → Formátovat pásku…."
"Tapes can't be deleted here. To take a tape out of the catalog, use Plugins → Forget a tape…." = "Pásky zde nelze mazat. Pásku odeberete z katalogu příkazem Pluginy → Zapomenout pásku…."
"Tapes can't be made as folders. Put a tape into the library and use Plugins → Format a tape…." = "Pásky nelze vytvářet jako složky. Vložte pásku do knihovny a použijte Pluginy → Formátovat pásku…."
"Tapes can't be renamed: a tape's name is its barcode." = "Pásky nelze přejmenovat: název pásky je její čárový kód."
"Tapes in the library that aren't in the catalog yet" = "Pásky v knihovně, které ještě nejsou v katalogu"
"Tapes" = "Pásky"
"The catalog of tape {barcode} was out of date and has been updated from the tape. Nothing was changed; check the files and try again." = "Katalog pásky {barcode} byl zastaralý a byl aktualizován z pásky. Nic se nezměnilo; zkontrolujte soubory a zkuste to znovu."
"The catalog {file} can't be opened: {error}" = "Katalog {file} nelze otevřít: {error}"
"The library holds {n} tapes." = "Pásky v knihovně: {n}."
"The tape can't be written: {reason}" = "Na pásku nelze zapisovat: {reason}"
"The tape is full. The files copied before it filled up are on it." = "Páska je plná. Soubory zkopírované před jejím zaplněním na ní jsou."
"The tape is taken out of the catalog; nothing on it changes." = "Páska se odebere z katalogu; na ní samotné se nic nezmění."
"The tape library can't be used: {reason}" = "Páskovou knihovnu nelze použít: {reason}"
"There are no tapes to import." = "Nejsou žádné pásky k načtení."
"These tapes were skipped, their files weren't copied: {tapes}" = "Tyto pásky byly přeskočeny, jejich soubory se nezkopírovaly: {tapes}"
"These tapes:" = "Tyto pásky:"
"This isn't the tape catalog." = "Toto není katalog pásek."
"Type the barcode again" = "Zadejte čárový kód znovu"
"Volume name" = "Název svazku"
"Volume: {name}" = "Svazek: {name}"
"\"{folder}\" isn't a folder." = "„{folder}“ není složka."
"empty" = "prázdná"
"library: {product}, {drives} drives" = "knihovna: {product}, mechaniky {drives}"
"no LTFS volume" = "bez svazku LTFS"
"not imported" = "nenačtena"
"outside the library" = "mimo knihovnu"
"{barcode}: no LTFS volume" = "{barcode}: bez svazku LTFS"
"{barcode}: {files} files, {size}" = "{barcode}: soubory {files}, {size}"
"{files} files, {size}, {free} free" = "soubory {files}, {size}, volno {free}"
