"Couldn't be read ({n}):" = "Nešlo přečíst ({n}):"
"Folder to back up" = "Složka k zálohování"
"Format and use it" = "Naformátovat a použít"
"Left out, larger than a whole tape ({n}):" = "Vynecháno, větší než celá páska ({n}):"
"No LTFS tape is in a library or drive now: new tapes are asked for." = "V knihovně ani mechanice teď není žádná páska LTFS: o nové pásky se požádá."
"No new tape showed up." = "Žádná nová páska se neobjevila."
"Nothing to back up: no file in the folder has the Archive attribute set." = "Není co zálohovat: žádný soubor ve složce nemá nastavený atribut Archiv."
"Stop the backup" = "Ukončit zálohu"
"Tape {barcode} has files on it, so it isn't used. Take it out and put in another one." = "Na pásce {barcode} jsou soubory, proto se nepoužije. Vyjměte ji a vložte jinou."
"Tape {barcode} isn't an LTFS volume: it is blank, or in another format. Format it for this backup? Anything on it is erased." = "Páska {barcode} není svazek LTFS: je prázdná, nebo v jiném formátu. Naformátovat ji pro tuto zálohu? Vše, co na ní je, se smaže."
