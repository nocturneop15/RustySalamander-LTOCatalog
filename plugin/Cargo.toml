[package]
name = "sal-plugin-ltocatalog"
description = "RustySalamander plugin: LTFS tapes in an LTO library, browsed offline from a catalog, loaded by the robot when needed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Install: copy target\<profile>\sal_plugin_ltocatalog.dll to
# plugins\ltocatalog\ltocatalog.spl next to rustysalamander.exe, with the lang folder beside it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sal-plugin-api.workspace = true
sal-window.workspace = true
sal-ui.workspace = true
lto-scsi.workspace = true
ltfs.workspace = true
lto-catalog.workspace = true
lto-archive.workspace = true
lto-sim.workspace = true

[target."cfg(windows)".dependencies]
# the Save dialog for a backup's full report
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
# the hostile inputs every field is tested with
sal-core = { path = "../../RustySalamander/crates/sal-core" }
